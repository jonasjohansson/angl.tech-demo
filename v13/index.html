<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANGL — V13</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="https://use.typekit.net/rug0svk.css">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Fixed viewport for images + overlays -->
    <div class="viewer-fixed">
      <div id="frame-container" class="frame-container"></div>

      <!-- SVG layer for callout lines (desktop) -->
      <svg id="callout-svg" class="callout-svg" xmlns="http://www.w3.org/2000/svg"></svg>

      <!-- Hotspot text panels (desktop) -->
      <div id="hotspot-container" class="hotspot-container"></div>

      <!-- Hotspot dots (mobile) -->
      <div id="hotspot-dots" class="hotspot-dots"></div>

      <!-- Mobile info card -->
      <div id="mobile-card" class="mobile-card">
        <button id="mobile-card-close" class="mobile-card-close" aria-label="Close">&times;</button>
        <div class="mobile-card-tag" id="mobile-card-tag"></div>
        <div class="mobile-card-title" id="mobile-card-title"></div>
        <div class="mobile-card-desc" id="mobile-card-desc"></div>
      </div>

      <!-- Loading -->
      <div id="loading-overlay" class="loading-overlay">
        <div class="loading-bar-track">
          <div id="loading-progress" class="loading-bar-fill"></div>
        </div>
        <span id="loading-text" class="loading-text">loading...</span>
      </div>
    </div>

    <script type="importmap">
    {
      "imports": {
        "tweakpane": "https://esm.sh/tweakpane@4.0.5"
      }
    }
    </script>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
