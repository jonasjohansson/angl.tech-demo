<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANGL — Gallery</title>
    <link rel="icon" href="data:," />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: #000;
        color: #999;
        font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
        overflow: hidden;
      }
      .viewer-main {
        width: 100vw;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .loading-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #000;
        z-index: 100;
        transition: opacity 0.5s ease;
      }
      .loading-overlay.loaded {
        opacity: 0;
        pointer-events: none;
      }
      .loading-bar-track {
        width: 200px;
        height: 2px;
        background: #222;
        margin-bottom: 16px;
      }
      .loading-bar-fill {
        height: 100%;
        width: 0%;
        background: #fff;
        transition: width 0.15s linear;
      }
      .loading-text {
        font-size: 11px;
        color: #666;
        letter-spacing: 0.05em;
      }
      .viewer-info {
        position: absolute;
        bottom: 24px;
        left: 24px;
        font-size: 11px;
        color: #666;
        line-height: 1.6;
        pointer-events: none;
        z-index: 10;
      }
      .context-nav {
        position: absolute;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        pointer-events: none;
      }
      .context-dots {
        display: flex;
        gap: 10px;
        pointer-events: auto;
      }
      .context-dots .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        border: 1px solid rgba(128, 128, 128, 0.5);
        background: transparent;
        cursor: pointer;
        padding: 0;
        transition: background 0.3s, border-color 0.3s;
      }
      .context-dots .dot.active {
        background: rgba(128, 128, 128, 0.8);
        border-color: rgba(128, 128, 128, 0.8);
      }
      .context-label {
        font-size: 10px;
        color: #888;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        transition: color 0.3s;
      }
      @media (max-width: 640px) {
        .viewer-info { bottom: 12px; left: 12px; }
      }
    </style>
  </head>
  <body>
    <main class="viewer-main">
      <canvas id="viewer-canvas"></canvas>

      <div id="loading-overlay" class="loading-overlay">
        <div class="loading-bar-track">
          <div id="loading-progress" class="loading-bar-fill"></div>
        </div>
        <span id="loading-text" class="loading-text">loading...</span>
      </div>

      <div class="viewer-info">
        ANGL-ASM-MAIN REV-G
      </div>

      <div class="context-nav">
        <div id="context-dots" class="context-dots"></div>
        <span id="context-label" class="context-label"></span>
      </div>
    </main>

    <script>
      const scenes = [
        { name: 'Living Room', src: '../img/hf_20260302_114001_7a459713-d6c7-48bd-a327-8351345f178c.jpeg' },
        { name: 'Bedroom',     src: '../img/hf_20260302_114201_098e7d70-bcfb-4367-b2e6-cbe6920e89c0.jpeg' },
        { name: 'Studio',      src: '../img/hf_20260302_114201_e56967ab-60d6-4d04-a40f-1285bbba7a66.png' },
      ];

      const canvas = document.getElementById('viewer-canvas');
      const overlay = document.getElementById('loading-overlay');
      const progressBar = document.getElementById('loading-progress');
      const progressText = document.getElementById('loading-text');
      const dotsEl = document.getElementById('context-dots');
      const labelEl = document.getElementById('context-label');

      // --- WebGL setup ---
      const gl = canvas.getContext('webgl', { antialias: false, alpha: false });
      if (!gl) { progressText.textContent = 'WebGL not supported'; throw new Error('No WebGL'); }

      function resize() {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = window.innerWidth * dpr;
        canvas.height = window.innerHeight * dpr;
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      resize();
      window.addEventListener('resize', resize);

      // --- Shaders ---
      const vsrc = `
        attribute vec2 a_pos;
        varying vec2 vUv;
        void main() {
          vUv = a_pos * 0.5 + 0.5;
          vUv.y = 1.0 - vUv.y;
          gl_Position = vec4(a_pos, 0.0, 1.0);
        }
      `;
      const fsrc = `
        precision mediump float;
        uniform sampler2D tA;
        uniform sampler2D tB;
        uniform float progress;
        uniform int direction;
        uniform vec2 screenSize;
        uniform vec2 sizeA;
        uniform vec2 sizeB;
        varying vec2 vUv;

        vec2 coverUV(vec2 uv, vec2 imgSize, vec2 scrSize) {
          float imgAspect = imgSize.x / imgSize.y;
          float scrAspect = scrSize.x / scrSize.y;
          vec2 scale = scrAspect > imgAspect
            ? vec2(1.0, imgAspect / scrAspect)
            : vec2(scrAspect / imgAspect, 1.0);
          return (uv - 0.5) * scale + 0.5;
        }

        void main() {
          float t;
          if (direction == 0)      t = 1.0 - vUv.y;
          else if (direction == 1) t = vUv.y;
          else if (direction == 2) t = vUv.x;
          else if (direction == 3) t = 1.0 - vUv.x;
          else if (direction == 4) t = (vUv.x + 1.0 - vUv.y) / 2.0;
          else if (direction == 5) t = (1.0 - vUv.x + 1.0 - vUv.y) / 2.0;
          else if (direction == 6) t = (vUv.x * 0.5 + (1.0 - vUv.y)) / 1.5;
          else                     t = ((1.0 - vUv.x) * 0.5 + vUv.y) / 1.5;
          float mask = step(t, progress);
          vec2 uvA = coverUV(vUv, sizeA, screenSize);
          vec2 uvB = coverUV(vUv, sizeB, screenSize);
          gl_FragColor = mix(texture2D(tA, uvA), texture2D(tB, uvB), mask);
        }
      `;

      function compileShader(type, src) {
        const s = gl.createShader(type);
        gl.shaderSource(s, src);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }

      const prog = gl.createProgram();
      gl.attachShader(prog, compileShader(gl.VERTEX_SHADER, vsrc));
      gl.attachShader(prog, compileShader(gl.FRAGMENT_SHADER, fsrc));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);

      const aPos = gl.getAttribLocation(prog, 'a_pos');
      const uTA = gl.getUniformLocation(prog, 'tA');
      const uTB = gl.getUniformLocation(prog, 'tB');
      const uProgress = gl.getUniformLocation(prog, 'progress');
      const uDirection = gl.getUniformLocation(prog, 'direction');
      const uScreenSize = gl.getUniformLocation(prog, 'screenSize');
      const uSizeA = gl.getUniformLocation(prog, 'sizeA');
      const uSizeB = gl.getUniformLocation(prog, 'sizeB');

      // Fullscreen quad
      const buf = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(aPos);
      gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

      // --- Texture upload ---
      function createTexture(img) {
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        return { tex, w: img.naturalWidth, h: img.naturalHeight };
      }

      // --- Load images ---
      function loadImage(src) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          img.onload = () => resolve(img);
          img.onerror = () => reject(new Error('Failed to load ' + src));
          img.src = src;
        });
      }

      (async function init() {
        const textures = [];
        for (let i = 0; i < scenes.length; i++) {
          progressText.textContent = `loading ${i + 1}/${scenes.length}...`;
          progressBar.style.width = ((i + 1) / scenes.length * 100) + '%';
          const img = await loadImage(scenes[i].src);
          textures.push(createTexture(img));
        }

        // --- Dots ---
        scenes.forEach((s, i) => {
          const dot = document.createElement('button');
          dot.className = 'dot' + (i === 0 ? ' active' : '');
          dot.setAttribute('aria-label', s.name);
          dot.addEventListener('click', () => { scrollPosition = i; });
          dotsEl.appendChild(dot);
        });
        labelEl.textContent = scenes[0].name;

        // --- Scroll ---
        const SCROLL_PER_SCENE = 400;
        let scrollPosition = 0;
        const wipeDirection = 3; // right → left

        canvas.addEventListener('wheel', (e) => {
          e.preventDefault();
          const delta = e.deltaY / SCROLL_PER_SCENE;
          scrollPosition = Math.max(0, Math.min(scenes.length - 1, scrollPosition + delta));
        }, { passive: false });

        // Touch support
        let touchStartY = 0;
        canvas.addEventListener('touchstart', (e) => {
          touchStartY = e.touches[0].clientY;
        }, { passive: true });
        canvas.addEventListener('touchmove', (e) => {
          e.preventDefault();
          const dy = touchStartY - e.touches[0].clientY;
          touchStartY = e.touches[0].clientY;
          const delta = dy / SCROLL_PER_SCENE;
          scrollPosition = Math.max(0, Math.min(scenes.length - 1, scrollPosition + delta));
        }, { passive: false });

        function updateDots(idx) {
          const dots = dotsEl.children;
          for (let i = 0; i < dots.length; i++) {
            dots[i].classList.toggle('active', i === idx);
          }
          labelEl.textContent = scenes[idx].name;
        }

        // --- Fade out loader ---
        overlay.classList.add('loaded');
        setTimeout(() => { overlay.style.display = 'none'; }, 600);

        // --- Render loop ---
        function draw() {
          requestAnimationFrame(draw);

          const fromIdx = Math.floor(scrollPosition);
          const toIdx = Math.min(fromIdx + 1, scenes.length - 1);
          const t = scrollPosition - fromIdx;

          updateDots(Math.round(scrollPosition));

          const a = textures[fromIdx];
          const b = textures[toIdx];

          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, a.tex);
          gl.uniform1i(uTA, 0);

          gl.activeTexture(gl.TEXTURE1);
          gl.bindTexture(gl.TEXTURE_2D, b.tex);
          gl.uniform1i(uTB, 1);

          gl.uniform1f(uProgress, t);
          gl.uniform1i(uDirection, wipeDirection);
          gl.uniform2f(uScreenSize, canvas.width, canvas.height);
          gl.uniform2f(uSizeA, a.w, a.h);
          gl.uniform2f(uSizeB, b.w, b.h);

          gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
        }
        draw();
      })().catch((err) => {
        console.error('Init failed:', err);
        progressText.textContent = 'failed — ' + err.message;
      });
    </script>
  </body>
</html>
